<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- dmg を開いたときの背景（660×460）。Chrome で background.png / background@2x.png に書き出す（scripts/make-dmg-background.sh）。
     アイコンの位置は package.json の build.dmg.contents（アプリ x=165・アプリケーション x=495、y=170）に合わせる。
     窓の高さ（build.dmg.window.height）はタイトルバーと下の帯の分だけ背景より約 76 大きくする（536）（同じにすると下が隠れる） -->
<style>
  html,body{margin:0;padding:0;width:660px;height:460px;overflow:hidden;background:#fff;}
  svg{display:block}
  text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;}
</style></head><body>
<svg width="660" height="460" viewBox="0 0 660 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="660" height="460" fill="url(#bg)"/>
  <text x="330" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">KantanProEX（DT）のインストール</text>

  <!-- アイコンの間の矢印 -->
  <path d="M250,170 C300,140 360,140 404,166" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M420,176 L401.7,175.5 L410.9,160.1 z" fill="#f97316" stroke="#f97316" stroke-width="3" stroke-linejoin="round"/>
  <text x="330" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">ドラッグ</text>

  <!-- 案内 -->
  <rect x="28" y="262" width="604" height="178" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <circle cx="54" cy="291" r="13" fill="#f97316"/><text x="54" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="76" y="296" font-size="15" font-weight="700" fill="#111827">左の KantanProEX を、右の「アプリケーション」へドラッグ</text>

  <circle cx="54" cy="331" r="13" fill="#f97316"/><text x="54" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="76" y="336" font-size="15" font-weight="700" fill="#111827">初めて開くときは警告が出ます。「完了」（または「キャンセル」）</text>
  <text x="76" y="358" font-size="15" font-weight="700" fill="#111827">を押し、システム設定 →「プライバシーとセキュリティ」</text>
  <text x="76" y="380" font-size="15" font-weight="700" fill="#111827">→ 下の方の「このまま開く」を押す</text>

  <text x="76" y="407" font-size="12" fill="#374151">「ゴミ箱に入れる」は押さないでください。macOS 14 以前は右クリック →「開く」でも可。</text>
  <text x="76" y="430" font-size="11.5" fill="#6b7280">Apple の署名をしていないための手順です。2回目からはダブルクリックで開けます。</text>
</svg>
</body></html>
